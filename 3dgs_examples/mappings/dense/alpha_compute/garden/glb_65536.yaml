# AccelForge FFM mapper (metric: energy), dense alpha_compute, scene garden
# arch: 3dgs_examples/arches/3dgs_render.yaml with GlobalBufferBytes=65536
# workload: 3dgs_examples/workloads/dense/alpha_compute/garden.yaml
# energy 46878.9 J, latency 1.09705e+06 s, DRAM 460138 GB
mapping:
  nodes:
  - !Storage
    tensors: [G2D, Alpha]
    component: DRAM
  - !Reservation
    purposes: [G2D, Alpha]
    resource: DRAM
  - !Temporal
    rank_variable: g
    tile_shape: 1
  - !Temporal
    rank_variable: v
    tile_shape: 1
  - !Storage
    tensors: [G2D]
    component: GlobalBuffer
  - !Reservation
    purposes: [G2D]
    resource: GlobalBuffer
  - !Temporal
    rank_variable: pu
    tile_shape: 1
  - !Temporal
    rank_variable: pv
    tile_shape: 240
  - !Spatial
    rank_variable: pv
    tile_shape: 1
    name: X
    component: ComputeAlphaArray
  - !Compute
    einsum: ComputeAlpha
    component: ComputeAlphaUnit
