# AccelForge FFM mapper (metric: energy), dense render, scene garden
# arch: 3dgs_examples/arches/3dgs_render.yaml with GlobalBufferBytes=65536
# workload: 3dgs_examples/workloads/dense/render/garden.yaml
# energy 6183.35 J, latency 28169.7 s, DRAM 2158.64 GB
mapping:
  nodes:
  - !Storage
    tensors: [G2D, I, F2D]
    component: DRAM
  - !Reservation
    purposes: [G2D, I, F2D]
    resource: DRAM
  - !Temporal
    rank_variable: pu
    tile_shape: 2
  - !Temporal
    rank_variable: v
    tile_shape: 1
  - !Storage
    tensors: [I]
    component: GlobalBuffer
  - !Reservation
    purposes: [I]
    resource: GlobalBuffer
  - !Temporal
    rank_variable: g
    tile_shape: 14
  - !Storage
    tensors: [G2D, F2D]
    component: GlobalBuffer
  - !Reservation
    purposes: [G2D, F2D]
    resource: GlobalBuffer
  - !Temporal
    rank_variable: pv
    tile_shape: 120
  - !Storage
    tensors: [Alpha]
    component: GlobalBuffer
  - !Sequential
    nodes:
    - !Nested
      nodes:
      - !Reservation
        purposes: [Alpha]
        resource: GlobalBuffer
      - !Temporal
        rank_variable: g
        tile_shape: 1
      - !Spatial
        rank_variable: pu
        tile_shape: 1
        name: X
        component: ComputeAlphaArray
      - !Spatial
        rank_variable: pv
        tile_shape: 1
        name: X
        component: ComputeAlphaArray
      - !Compute
        einsum: ComputeAlpha
        component: ComputeAlphaUnit
    - !Nested
      nodes:
      - !Reservation
        purposes: [Alpha]
        resource: GlobalBuffer
      - !Temporal
        rank_variable: pv
        tile_shape: 8
      - !Spatial
        rank_variable: g
        tile_shape: 1
        name: X
        component: ComputeBlendArray
      - !Spatial
        rank_variable: pu
        tile_shape: 1
        name: X
        component: ComputeBlendArray
      - !Spatial
        rank_variable: pv
        tile_shape: 1
        name: X
        component: ComputeBlendArray
      - !Compute
        einsum: ComputeBlend
        component: ComputeBlendUnit
