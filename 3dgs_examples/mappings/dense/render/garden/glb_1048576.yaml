# AccelForge FFM mapper (metric: energy), dense render, scene garden
# arch: 3dgs_examples/arches/3dgs_render.yaml with GlobalBufferBytes=1048576
# workload: 3dgs_examples/workloads/dense/render/garden.yaml
# energy 7970.05 J, latency 64706.2 s, DRAM 71.1203 GB
mapping:
  nodes:
  - !Storage
    tensors: [G2D, I, F2D]
    component: DRAM
  - !Reservation
    purposes: [G2D, I, F2D]
    resource: DRAM
  - !Temporal
    rank_variable: pv
    tile_shape: 96
  - !Temporal
    rank_variable: v
    tile_shape: 1
  - !Storage
    tensors: [I]
    component: GlobalBuffer
  - !Reservation
    purposes: [I]
    resource: GlobalBuffer
  - !Temporal
    rank_variable: g
    tile_shape: 14
  - !Storage
    tensors: [G2D, F2D]
    component: GlobalBuffer
  - !Reservation
    purposes: [G2D, F2D]
    resource: GlobalBuffer
  - !Temporal
    rank_variable: pu
    tile_shape: 2
  - !Storage
    tensors: [Alpha]
    component: GlobalBuffer
  - !Sequential
    nodes:
    - !Nested
      nodes:
      - !Reservation
        purposes: [Alpha]
        resource: GlobalBuffer
      - !Temporal
        rank_variable: g
        tile_shape: 1
      - !Spatial
        rank_variable: pu
        tile_shape: 1
        name: X
        component: ComputeAlphaArray
      - !Spatial
        rank_variable: pv
        tile_shape: 1
        name: X
        component: ComputeAlphaArray
      - !Compute
        einsum: ComputeAlpha
        component: ComputeAlphaUnit
    - !Nested
      nodes:
      - !Reservation
        purposes: [Alpha]
        resource: GlobalBuffer
      - !Temporal
        rank_variable: pv
        tile_shape: 8
      - !Spatial
        rank_variable: g
        tile_shape: 1
        name: X
        component: ComputeBlendArray
      - !Spatial
        rank_variable: pu
        tile_shape: 1
        name: X
        component: ComputeBlendArray
      - !Spatial
        rank_variable: pv
        tile_shape: 1
        name: X
        component: ComputeBlendArray
      - !Compute
        einsum: ComputeBlend
        component: ComputeBlendUnit
