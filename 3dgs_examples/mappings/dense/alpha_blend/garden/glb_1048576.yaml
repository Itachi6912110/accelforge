    tensors: [F2D]
    component: GlobalBuffer
  - !Reservation
    purposes: [F2D]
    resource: GlobalBuffer
  - !Temporal
    rank_variable: pu
    tile_shape: 2
  - !Temporal
    rank_variable: pv
    tile_shape: 8
  - !Spatial
    rank_variable: g
    tile_shape: 1
    name: X
    component: ComputeBlendArray
  - !Spatial
    rank_variable: pu
    tile_shape: 1
    name: X
    component: ComputeBlendArray
  - !Spatial
    rank_variable: pv
    tile_shape: 1
    name: X
