# AccelForge FFM mapper (metric: energy), dense gaussian_project, scene garden
# arch: 3dgs_examples/arches/3dgs_render.yaml with GlobalBufferBytes=65536
# workload: 3dgs_examples/workloads/dense/gaussian_project/garden.yaml
# energy 0.515034 J, latency 11.1326 s, DRAM 4.66936 GB
mapping:
  nodes:
  - !Storage
    tensors: [View, G3D, G2D]
    component: DRAM
  - !Storage
    tensors: [View]
    component: GlobalBuffer
  - !Reservation
    purposes: [View, G3D, G2D]
    resource: DRAM
  - !Reservation
    purposes: [View]
    resource: GlobalBuffer
  - !Temporal
    rank_variable: g
    tile_shape: 14
  - !Storage
    tensors: [G3D]
    component: GlobalBuffer
  - !Reservation
    purposes: [G3D]
    resource: GlobalBuffer
  - !Temporal
    rank_variable: v
    tile_shape: 5
  - !Spatial
    rank_variable: g
    tile_shape: 1
    name: X
    component: ComputeProjectArray
  - !Spatial
    rank_variable: v
    tile_shape: 1
    name: X
    component: ComputeProjectArray
  - !Compute
    einsum: ComputeProject
    component: ComputeProjectUnit
