# 3DGS render = Gaussian projection -> alpha compute -> alpha blend as one Einsum
# cascade, DENSE association (3DGSArchSpace.pptx p.2). G2D and alpha are intermediates,
# so the mapper may fuse the stages and keep them on chip (the arch's DRAM keeps only
# ~Intermediates).
#
#   G2D[v, g]           = ComputeProject(G3D[g], View[v])
#   alpha[v, g, pu, pv] = ComputeAlpha(G2D[v, g], pu, pv)
#   I[v, pu, pv]        = ComputeBlend(F2D[v, g], alpha[v, g, pu, pv])   (reduce over g)
#
# Same assumptions, bits and garden defaults as ../gaussian_project/garden.yaml,
# ../alpha_compute/garden.yaml and ../alpha_blend/garden.yaml.
{% set Nv = Nv | default(185) %}
{% set Ng = Ng | default(1041334) %}
{% set NpRow = NpRow | default(622) %}
{% set NpCol = NpCol | default(960) %}
{% set AlphaBits = AlphaBits | default(32) %}

workload:
  iteration_space_shape:
    v: 0 <= v < {{Nv}}
    g: 0 <= g < {{Ng}}
    pu: 0 <= pu < {{NpRow}}
    pv: 0 <= pv < {{NpCol}}

  einsums:
  - name: ComputeProject
    tags: [compute_project]
    tensor_accesses:
    - {name: G3D, projection: [g], bits_per_value: 352}
    - {name: View, projection: [v], bits_per_value: 640}
    - {name: G2D, projection: [v, g], output: True, bits_per_value: 192}

  - name: ComputeAlpha
    tags: [compute_alpha]
    tensor_accesses:
    - {name: G2D, projection: [v, g], bits_per_value: 192}
    - {name: Alpha, projection: [v, g, pu, pv], output: True, bits_per_value: {{AlphaBits}}}

  - name: ComputeBlend
    tags: [compute_blend]
    tensor_accesses:
    - {name: Alpha, projection: [v, g, pu, pv], bits_per_value: {{AlphaBits}}}
    - {name: F2D, projection: [v, g], bits_per_value: 96}
    - {name: I, projection: [v, pu, pv], output: True, bits_per_value: 128}
