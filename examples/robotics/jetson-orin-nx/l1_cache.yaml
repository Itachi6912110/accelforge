!Memory

name: L1Cache

# Per-SM L1 data cache on the Ampere GA10B GPU (Jetson Orin NX, 16GB variant).
# Each SM has 128 KB of combined L1 data cache + shared memory (configurable split).
# Same SM design as Jetson Orin Nano.
# Modeled with CACTI via hwcomponents_cacti.SRAM (cache_type="ram").
# The access width matches a 128-bit (16-byte) cache line.
#
# Specs (per SM):
#   Size:          128 KB
#   Cache line:    128 bits (16 bytes)
#   Tech node:     Samsung 8nm → 8e-9 m
#   Number of SMs: 8  (Jetson Orin NX 16GB)
component_class: SimpleSRAMCache

size: 1048576  # 128 * 1024 * 8 = 128 KB in bits

extra_attributes_for_component_model:
  tech_node: 8e-9
  cache_size_bytes: 131072  # 128 KB in bytes
  block_size_bytes: 16      # 16 bytes per cache line
  associativity: 4          # 4-way set associative (typical for L1 caches)

actions:
- {name: read,  bits_per_action: 128}  # one full cache-line read
- {name: write, bits_per_action: 128}  # one full cache-line write
