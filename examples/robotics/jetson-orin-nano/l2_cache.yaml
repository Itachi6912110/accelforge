!Memory

name: L2Cache

# Shared L2 cache of the Ampere GA10B GPU on Jetson Orin Nano (8GB variant).
# Modeled with CACTI via hwcomponents_cacti.SRAM (cache_type="ram").
# Using SRAM avoids CACTI instability with high-associativity tag-array configurations.
# The access width matches a 64-byte (512-bit) cache line.
#
# Specs:
#   Total size:    4 MB (shared across all 8 SMs)
#   Cache line:    64 bytes (512 bits)
#   Tech node:     Samsung 8nm → 8e-9 m
#                  (CACTI extrapolates below its 22nm floor using sqrt energy scaling)
component_class: SRAM

size: 33554432  # 4 * 1024 * 1024 * 8 = 4 MB in bits

extra_attributes_for_component_model:
  tech_node: 8e-9
  width: 512        # 64-byte cache line in bits
  n_banks: 8

actions:
- {name: read,  bits_per_action: 512}  # one full cache-line read
- {name: write, bits_per_action: 512}  # one full cache-line write
