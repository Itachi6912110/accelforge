!Compute

name: StreamingProcessor

# One SM (Streaming Multiprocessor) of the Ampere GA10B GPU on Jetson Orin Nano.
# Each SM contains 128 FP32 CUDA cores modeled as parallel IntMAC units
# (AladdinIntMAC, scaled from 40 nm baseline to 8 nm via Stillmaker & Baas 2017 tables).
#
# Note: IntMAC is an ASIC-based model. GPU SMs carry additional overhead
# (warp scheduler, register file, operand collectors) not captured here.
# This gives a lower-bound energy estimate for the compute fabric.
#
# Specs (per SM):
#   CUDA cores:  128 FP32 (modeled as 32-bit multiplier + 32-bit adder)
#   GPU clock:   1.02 GHz (Jetson Orin Nano max)  →  period = 9.804e-10 s
#   Tech node:   Samsung 8nm → 8e-9 m
#   SMs total:   8  (Jetson Orin Nano 8GB)
component_class: IntMAC

n_parallel_instances: 128  # 128 FP32 CUDA cores per SM

extra_attributes_for_component_model:
  tech_node: 8e-9
  multiplier_width: 32   # FP32 approximated as INT32 for area/energy
  adder_width: 32

actions:
- {name: compute, latency: 9.804e-10}  # 1 / 1.02e9 = 9.804e-10 s (one clock period)
