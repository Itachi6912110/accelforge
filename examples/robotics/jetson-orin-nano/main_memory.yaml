!Memory

name: MainMemory

# LPDDR5X on Jetson Orin Nano (8GB variant).
# The LPDDR5 component model is registered as a custom hwcomponents.ComponentModel
# in the analysis notebook before this file is loaded.
#
# Specs:
#   Process:    Samsung 8nm (8LPP)
#   Bus width:  128-bit (2x 64-bit channels)
#   Bandwidth:  68 GB/s peak (LPDDR5X @ 8533 MT/s)
#   Energy:     ~3.7 pJ/bit (JEDEC LPDDR5 literature)
component_class: LPDDR5

size: inf

actions:
- {name: read,  bits_per_action: 128}  # full 128-bit bus access
- {name: write, bits_per_action: 128}
