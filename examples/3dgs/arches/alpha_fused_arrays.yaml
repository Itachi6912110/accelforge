# DRAM -> GlobalBuffer (cache) -> { 16x16 alpha-compute array | 16x16 alpha-blend array }.
# Pairs with examples/3dgs/workloads/alpha_fused[_stencil].yaml.
#
# The two arrays share DRAM and the GlobalBuffer and are otherwise the same components
# as arches/alpha_compute_array.yaml and arches/alpha_blend_array.yaml (see those files
# for the model choices). The !Fork gives the alpha-compute array its own branch so its
# fanout does not apply to the blend path; `enabled:` pins each Einsum (by tag) to its
# array. Alpha produced by AlphaCompute can stay in the GlobalBuffer (DRAM keeps only
# ~Intermediates) and be consumed there by AlphaBlend.
{% set GlobalBufferBytes = GlobalBufferBytes | default(65536) %}
{% set TechNode = TechNode | default(16e-9) %}
{% set ArrayDim = ArrayDim | default(16) %}

arch:
  nodes:
  - !Memory
    name: DRAM
    component_class: LPDDR4
    size: inf
    area: 0
    tensors: {keep: ~Intermediates, may_keep: All}
    extra_attributes_for_component_model: {width: 64}
    actions:
    - {name: read, bits_per_action: 64}
    - {name: write, bits_per_action: 64}

  - !Memory
    name: GlobalBuffer
    component_class: SimpleSRAMCache
    size: {{GlobalBufferBytes * 8}}
    tensors: {keep: ~DRAM, may_keep: All}
    extra_attributes_for_component_model:
      tech_node: {{TechNode}}
      cache_size_bytes: {{GlobalBufferBytes}}
      block_size_bytes: 32
      associativity: 4
    actions:
    - {name: read, bits_per_action: 256}
    - {name: write, bits_per_action: 256}

  - !Fork
    nodes:
    - !Container
      name: AlphaComputeArray
      spatial:
      - {name: X, fanout: {{ArrayDim}}}
      - {name: Y, fanout: {{ArrayDim}}}
    - !Compute
      name: AlphaPE
      component_class: IntMAC
      enabled: alpha_compute
      extra_attributes_for_component_model:
        tech_node: {{TechNode}}
        multiplier_width: 32
        adder_width: 32
      actions:
      - {name: compute, energy_scale: 12}

  - !Container
    name: AlphaBlendArray
    spatial:
    - {name: X, fanout: {{ArrayDim}}}
    - {name: Y, fanout: {{ArrayDim}}}

  - !Compute
    name: BlendPE
    component_class: IntMAC
    enabled: alpha_blend
    extra_attributes_for_component_model:
      tech_node: {{TechNode}}
      multiplier_width: 32
      adder_width: 32
    actions:
    - {name: compute, energy_scale: 6}
